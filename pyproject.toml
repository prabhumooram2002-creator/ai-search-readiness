[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "ai-search-readiness"
version = "6.6.0"
description = "AI Search Intelligence and Semantic Repair Platform — crawl, chunk, embed, graph, repair, and simulate AI answers"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "crawl4ai>=0.5.0",
    "chromadb>=0.4.0",
    "httpx>=0.27.0",
    "tiktoken>=0.7.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "tenacity>=9.0.0",
]

[project.urls]
Homepage = "https://github.com/your-org/ai-search-readiness"
Documentation = "https://github.com/your-org/ai-search-readiness#readme"

[project.scripts]
ai-search = "src.main:main"
hermes = "src.orchestrator.__main__:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
"*" = ["*.md", "*.yaml", "*.json"]
