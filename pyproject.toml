[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "ai-search-readiness"
version = "6.6.0"
description = "AI Search Intelligence and Semantic Repair Platform — crawl, chunk, embed, graph, repair, and simulate AI answers"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "crawl4ai>=0.5.0",
    "chromadb>=0.4.0",
    "kuzu>=0.4.0",
    "httpx>=0.27.0",
    "tiktoken>=0.7.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "tenacity>=9.0.0",
    # Local-first model stack (no API keys required)
    "ollama>=0.3.0",
    "sentence-transformers>=3.0.0",
    "pysbd>=0.3.4",
    "spacy>=3.7.0",
    "hdbscan>=0.8.40",
    "node2vec>=0.4.6",
    "scikit-learn>=1.4.0",
    "rank-bm25>=0.2.2",
    "rapidfuzz>=3.9.0",
    "pymupdf>=1.24.0",
    "transformers>=4.44.0",
    "gliner>=0.2.13",
    "glirel>=1.0.0",
    "loguru>=0.7",  # glirel runtime dep, missing from its own metadata
    "networkx>=3.0",
    "textstat>=0.7.3",  # Phase 12 section 16 — readability metrics
]

[project.urls]
Homepage = "https://github.com/prabhumooram2002-creator/ai-search-readiness"
Documentation = "https://github.com/prabhumooram2002-creator/ai-search-readiness#readme"

[project.scripts]
ai-search = "src.main:main"
# Hermes is an optional, non-default subsystem (quarantined in Layer -1).
hermes = "src.optional.hermes.__main__:main"

[tool.pytest.ini_options]
# Only collect the real suite; root-level test_*.py are ad-hoc scratch scripts.
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
"*" = ["*.md", "*.yaml", "*.json"]
